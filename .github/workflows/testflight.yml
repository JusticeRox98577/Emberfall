name: TestFlight
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      TEAM_ID: ${{ vars.TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Apple secrets
        id: check
        env:
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$KEY_P8" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::App Store Connect key secrets not added yet. Add them, then run this workflow again."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Select newest Xcode
        if: steps.check.outputs.ready == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Require Xcode 26.6 or newer
        if: steps.check.outputs.ready == 'true'
        run: |
          xcodebuild -version
          VER=$(xcodebuild -version | head -1 | awk '{print $2}')
          if [ "$(printf '%s\n26.6\n' "$VER" | sort -V | head -1)" != "26.6" ]; then
            echo "::error::Xcode $VER is older than 26.6. App Store Connect needs a build made with 26.6 or newer."
            exit 1
          fi
      - name: Install xcodegen
        if: steps.check.outputs.ready == 'true'
        run: brew install xcodegen
      - name: Write App Store Connect key
        if: steps.check.outputs.ready == 'true'
        env:
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$KEY_P8" > "$HOME/private_keys/AuthKey_$KEY_ID.p8"
      - name: Find app and team from the App Store Connect key
        if: steps.check.outputs.ready == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" scripts/resolve_app.py
      - name: Generate project
        if: steps.check.outputs.ready == 'true'
        run: xcodegen generate
      - name: Archive
        if: steps.check.outputs.ready == 'true'
        run: |
          xcodebuild archive \
            -project EmberFall.xcodeproj -scheme EmberFall \
            -destination 'generic/platform=iOS' \
            -archivePath build/EmberFall.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
      - name: Export and upload to TestFlight
        if: steps.check.outputs.ready == 'true'
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/EmberFall.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
